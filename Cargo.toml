[package]
name = "modelc"
version = "0.1.7"
edition = "2024"
# Minimum supported Rust version: edition 2024 (1.85) plus `let`-chains (1.88).
rust-version = "1.88"
authors = ["Ying Kit WONG"]
description = "Compile LLM weights (GGUF, Safetensors, ONNX, PyTorch) into a single .modelc artifact and serve an OpenAI-compatible inference API."
license = "Apache-2.0"
repository = "https://github.com/yingkitw/modelc"
homepage = "https://github.com/yingkitw/modelc"
documentation = "https://docs.rs/modelc"
readme = "README.md"
keywords = ["llm", "inference", "gguf", "safetensors", "onnx"]
categories = ["command-line-utilities", "science", "parser-implementations", "compilers"]
build = "build.rs"

[[bin]]
name = "modelc"
path = "src/bin/modelc.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
safetensors = "0.4"
tempfile = "3"
half = "2"
onnx-rs = "0.1.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tokio-stream = "0.1"
dirs = "6"
toml = "0.8"
ureq = "3"
regex = "1"
jsonschema = "0.29"
zstd = "0.13"
rand = "0.8"
minijinja = "2"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"

# Optimized release profile: thin LTO + single codegen unit for whole-program
# optimization, plus symbol stripping for a smaller binary. Skips `panic = "abort"`
# so the Tokio runtime and `cargo test` keep working with unwinding.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

