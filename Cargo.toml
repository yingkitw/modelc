[package]
name = "modelc"
version = "0.1.9"
edition = "2024"
authors = ["Ying Kit WONG"]
description = "Rust CLI that compiles LLM weights (GGUF, Safetensors, ONNX, PyTorch) into a single .modelc artifact and serves a local OpenAI-compatible inference API with Metal GPU and CPU SIMD acceleration."
license = "Apache-2.0"
repository = "https://github.com/yingkitw/modelc"
homepage = "https://github.com/yingkitw/modelc"
documentation = "https://docs.rs/modelc"
readme = "README.md"
keywords = ["llm", "inference", "openai", "gguf", "transformer"]
categories = ["command-line-utilities", "science", "parser-implementations", "compilers", "web-programming::http-server"]
build = "build.rs"

[[bin]]
name = "modelc"
path = "src/bin/modelc.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
safetensors = "0.4"
half = "2"
onnx-rs = "0.1.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tokio-stream = "0.1"
dirs = "6"
toml = "0.8"
regex = "1"
zstd = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"

# Optimized release profile: thin LTO + single codegen unit for whole-program
# optimization, plus symbol stripping for a smaller binary. Skips `panic = "abort"`
# so the Tokio runtime and `cargo test` keep working with unwinding.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

